version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: toeic_vocab_postgres
    restart: always
    environment:
      POSTGRES_USER: toeic_user
      POSTGRES_PASSWORD: toeic_password
      POSTGRES_DB: toeic_vocab_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
